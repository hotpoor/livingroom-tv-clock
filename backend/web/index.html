<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153c35"><title>家里的冰箱 · 清单编辑</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<section id="login" class="login hidden"><form id="login-form" class="login-card"><div class="brand-icon">▤</div><p class="eyebrow">家里的冰箱</p><h1>把食材，整理明白。</h1><p class="muted">在手机或电脑上整理，客厅电视同步呈现。</p><label>访问口令<input id="password" type="password" autocomplete="current-password" required maxlength="120"></label><button class="primary" type="submit">进入清单 <span>→</span></button><p id="login-error" role="alert"></p></form></section>
<div id="app" class="hidden"><aside class="sidebar"><a class="brand" href="/">▤ <span>家里的冰箱<small>家庭食材清单</small></span></a><p class="eyebrow section-label">我的冰箱</p><nav id="fridges" aria-label="选择冰箱"></nav><button id="open-model-trial" class="text-button">✦ 4B 解析试验</button><button id="add-fridge" class="text-button">＋ 添加一台冰箱</button><div class="sidebar-footer"><span class="online-dot"></span><span id="device-state">正在检查电视同步…</span><button id="logout" class="quiet">退出</button></div></aside>
<main><header class="topbar"><span>清单编辑 <span class="slash">/</span> <span id="breadcrumb">全部食材</span></span><span id="version" class="version"></span></header><div class="workspace">
<section class="page-heading"><div><p class="eyebrow">FRESH THINGS, CLEAR MIND</p><h1 id="heading">食材清单</h1><p id="subheading" class="muted">每一份食材，都有自己的位置。</p></div><button id="add-item" class="primary">＋ 添加食材</button></section>
<div id="notice" class="notice hidden" role="status"></div><div id="conflicts"></div>
<section class="stats" aria-label="库存概览"><div><span>食材批次</span><strong id="stat-items">0</strong></div><div><span>七天内到期</span><strong id="stat-soon">0</strong></div><div><span>已过期</span><strong id="stat-expired">0</strong></div><div><span>保质期未知</span><strong id="stat-unknown">0</strong></div></section>
<section class="toolbar"><div id="filters" class="filters" aria-label="分区筛选"></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="找一找食材…" aria-label="搜索食材"></label></section>
<div class="list-heading"><span id="list-count"></span><div><button id="rename-fridge" class="quiet">重命名</button><button id="delete-fridge" class="quiet danger">删除冰箱</button><button id="refresh" class="quiet">↻ 刷新</button></div></div>
<section id="items" class="items" aria-label="食材列表"></section><p class="footnote">保存后同步到电视 · 同名不同批次分别管理</p>
</div></main></div>
<dialog id="item-dialog"><form id="item-form"><div class="dialog-heading"><div><p class="eyebrow">整理清单</p><h2 id="dialog-title">添加食材</h2></div><button type="button" class="close" aria-label="关闭">×</button></div><div class="form-grid"><label class="wide">食材名称<input id="food-name" required maxlength="80" placeholder="例如：草莓酸奶"></label><label>数量<input id="food-quantity" type="number" min="0" max="999999" step="1" required value="1"></label><label>单位<input id="food-unit" required maxlength="8" value="个" placeholder="个 / 盒 / 瓶"></label><label>存放分区<input id="food-location" required maxlength="40" list="locations" placeholder="选择或填写分区"><datalist id="locations"><option>上部冷藏</option><option>下部冷藏</option><option>冷藏</option><option>冷冻</option><option>其他</option></datalist></label><label>所在冰箱<select id="food-fridge" required></select></label><label>生产 / 开始日期<input id="food-start" type="date"></label><label>到期日期<input id="food-end" type="date"></label><label class="wide">备注<input id="food-note" maxlength="120" placeholder="保质期不清楚可以留空，建议尽快食用"></label></div><p class="form-tip">日期可留空；有开始日期时，请一并填写到期日期。</p><p id="form-error" role="alert"></p><div class="dialog-actions"><button id="remove-item" type="button" class="quiet danger">删除这批食材</button><span></span><button type="button" class="secondary close-dialog">取消</button><button id="save-item" class="primary" type="submit">保存并同步</button></div></form></dialog>
<dialog id="name-dialog"><form id="name-form"><h2 id="name-title">添加冰箱</h2><label>冰箱名称<input id="fridge-name" required maxlength="20" placeholder="例如：厨房冰箱"></label><p id="name-error" role="alert"></p><div class="dialog-actions"><span></span><button type="button" class="secondary close-dialog">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="confirm-dialog"><div class="dialog-heading"><h2 id="confirm-title"></h2></div><p id="confirm-message"></p><div class="dialog-actions"><span></span><button id="confirm-cancel" class="secondary">取消</button><button id="confirm-ok" class="primary">确认</button></div></dialog>
<dialog id="model-trial-dialog"><form id="model-trial-form"><div class="dialog-heading"><div><p class="eyebrow">QWEN 3.5 · 4B</p><h2>解析试验</h2></div><button type="button" class="close" aria-label="关闭试验">×</button></div><p class="muted">先看看它如何理解你的话。测试不会更新库存或保存日程，电视继续使用 0.8B。</p><label>测试类型<select id="trial-mode"><option value="fridge">冰箱库存 · 参考当前清单</option><option value="schedule">日程事项</option></select></label><label>说说你想做什么<textarea id="trial-text" required maxlength="1000" rows="4" placeholder="例如：红颜草莓酸奶放入三个，在三楼客厅冰箱"></textarea></label><p id="trial-error" role="alert"></p><div id="trial-result" class="hidden" aria-live="polite"><p id="trial-timing"></p><div id="trial-fields"></div><details><summary>查看完整 JSON</summary><pre id="trial-json"></pre></details></div><div class="dialog-actions"><span></span><button type="button" class="secondary close-dialog">关闭</button><button id="trial-submit" type="submit" class="primary">用 4B 解析</button></div></form></dialog>
</body></html>
