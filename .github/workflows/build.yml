name: Build Android TV APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: pwsh
        run: |
          $manager = Get-ChildItem -LiteralPath "$env:ANDROID_HOME\cmdline-tools" -Filter sdkmanager.bat -Recurse | Select-Object -First 1
          if (!$manager) { throw 'Android SDK command-line tools not found on runner' }
          & $manager.FullName 'platforms;android-28' 'build-tools;35.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed' }
      - name: Build and verify
        shell: pwsh
        run: ./verify.ps1
      - name: Check schedule parser
        run: python -m unittest discover -s backend -v
      - uses: actions/upload-artifact@v7
        with:
          name: livingroom-flipclock-debug
          path: build/livingroom-flipclock.apk
          retention-days: 7
