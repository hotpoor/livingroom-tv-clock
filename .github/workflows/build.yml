name: Build Android TV APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager 'platforms;android-28' 'build-tools;35.0.0' 'platform-tools'
      - name: Build and verify
        shell: pwsh
        run: ./verify.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: livingroom-flipclock-debug
          path: build/livingroom-flipclock.apk
          retention-days: 7
